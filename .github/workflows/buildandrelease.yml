name: Build And Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

jobs:
  test_and_build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      - name: Run the tests
        run: lua5.1 tests/targeting_test.lua

      - name: Build the package
        run: |
          mkdir -p build
          sed -i 's/cpc.version = "0.0.0"/cpc.version = "testing"/g' cpc.xml
          zip --junk-paths build/cpc.mpackage README.md cpc.xml LICENSE config.lua

  release:
    name: Create Release if tagged
    needs: test_and_build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/*/}" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: |
          mkdir -p build
          sed -i 's/cpc.version = "0.0.0"/cpc.version = "${{ steps.get_version.outputs.version }}"/g' cpc.xml
          zip --junk-paths build/cpc.mpackage README.md cpc.xml LICENSE config.lua

      - name: Create the release with the package attached
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          files: build/cpc.mpackage
